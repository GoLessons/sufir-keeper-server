services:
  devcheck:
    build:
      context: .
      dockerfile: .docker/go/Dockerfile
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      - GOCACHE=/workspace/.gocache
      - GOFLAGS=-buildvcs=false
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: bash -lc "chmod +x tools/devcheck.sh && tools/devcheck.sh"

  postgres:
    build:
      context: .
      dockerfile: .docker/postgres/Dockerfile
    container_name: keeper-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-keeper}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-keeper}
      - POSTGRES_DB=${POSTGRES_DB:-keeper}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-keeper} -d ${POSTGRES_DB:-keeper}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: .docker/migrate/Dockerfile
    container_name: keeper-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command: ["-path=/migrations", "-database=${DB_DSN:-postgres://keeper:keeper@postgres:5432/keeper?sslmode=disable}", "up"]
    restart: on-failure

  vault:
    image: hashicorp/vault:1.15.6
    container_name: keeper-vault
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=${VAULT_TOKEN:-dev-root-token}
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
      - VAULT_ADDR=http://127.0.0.1:8200
    cap_add:
      - IPC_LOCK
    command: ["server", "-dev"]
    healthcheck:
      test: ["CMD-SHELL", "vault status >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: .docker/go/Dockerfile
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      - GOCACHE=/workspace/.gocache
      - GOFLAGS=-buildvcs=false
      - DB_DSN=${DB_DSN:-postgres://keeper:keeper@postgres:5432/keeper?sslmode=disable}
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET:-dev-secret-change-in-prod}
      - APP_CONFIG_PATH=/workspace/cmd/server/config.json
      - HTTP_ADDR=0.0.0.0
      - HTTP_PORT=8080
      - VAULT_ADDR=${VAULT_ADDR:-http://vault:8200}
      - VAULT_TOKEN=${VAULT_TOKEN:-dev-root-token}
      - VAULT_KV_PATH=${VAULT_KV_PATH:-keeper/keyencrypt}
      - MASTER_KEY_HEX=${MASTER_KEY_HEX:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_BUCKET=${S3_BUCKET:-keeper}
      - MINIO_WEBHOOK_SECRET=${MINIO_WEBHOOK_SECRET:-dev-webhook-secret}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      vault:
        condition: service_healthy
    command: go run ./cmd/server

  minio:
    build:
      context: .
      dockerfile: .docker/minio/Dockerfile
    container_name: keeper-minio
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_NOTIFY_WEBHOOK_ENABLE_1=true
      - MINIO_NOTIFY_WEBHOOK_ENDPOINT_1=http://app:8080/files/webhook-minio
      - MINIO_NOTIFY_WEBHOOK_AUTH_TOKEN_1=${MINIO_WEBHOOK_SECRET:-dev-webhook-secret}
      - MINIO_NOTIFY_WEBHOOK_QUEUE_DIR_1=/data/webhook-queue
      - MINIO_NOTIFY_WEBHOOK_QUEUE_LIMIT_1=1000
    volumes:
      - minio-data:/data

  swagger-ui:
    build:
      context: .
      dockerfile: .docker/swagger-ui/Dockerfile
    container_name: keeper-swagger

  nginx:
    build:
      context: .
      dockerfile: .docker/nginx/Dockerfile
    container_name: keeper-nginx
    depends_on:
      app:
        condition: service_started
      swagger-ui:
        condition: service_started
    volumes:
      - ./.docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./.docker/nginx/certs:/etc/nginx/certs:ro
    #  - ./docs/schema.yaml:/etc/nginx/html/openapi.yaml:ro
    ports:
      - "8443:443"

volumes:
  postgres-data:
  minio-data:
