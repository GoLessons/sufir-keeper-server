name: E2E Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Install docker-compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.24.1/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version

      - name: Start services
        run: |
          docker-compose up -d --build
          docker-compose ps

      - name: Wait for services to be ready
        run: |
          # Wait for postgres
          timeout 60s bash -c 'until docker-compose exec -T postgres pg_isready -U keeper -d keeper; do echo "Waiting for postgres..."; sleep 2; done'
          
          # Wait for migrations to complete (migrate container exits successfully)
          timeout 60s bash -c 'until [ "$(docker inspect -f "{{.State.Status}}" keeper-migrate 2>/dev/null)" == "exited" ] && [ "$(docker inspect -f "{{.State.ExitCode}}" keeper-migrate 2>/dev/null)" == "0" ]; do echo "Waiting for migrations..."; sleep 2; done'

          # Wait for app to be responsive
          timeout 60s bash -c 'until curl -s http://localhost:8080/api/v1/auth-verify > /dev/null; do echo "Waiting for app..."; sleep 2; done'

      - name: Run E2E tests
        run: |
          chmod +x tools/e2e.sh
          ./tools/e2e.sh

      - name: Stop services
        if: always()
        run: docker-compose down
