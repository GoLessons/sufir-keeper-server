name: Run tests

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  tests:
    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: tests-${{ github.ref }}
      cancel-in-progress: true
    env:
      GOFLAGS: -buildvcs=false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Run tests (-race)
        run: |
          set -e
          go test -race -count=0 ./...

      - name: Generate coverage
        run: |
          set -e
          go test ./... -covermode=atomic -coverprofile=coverage.out

      - name: Compute coverage value
        id: cov
        run: |
          set -e
          src="coverage.out"
          if [ ! -s "$src" ]; then
            echo "coverage.out not found or empty" >&2
            exit 1
          fi
          pct=$(go tool cover -func="$src" | awk '/^[[:space:]]*total:/ {print $NF}' | tr -d '%')
          if [ -z "$pct" ]; then
            echo "Failed to parse total coverage, dumping cover func output for debug:" >&2
            go tool cover -func="$src" || true
            pct="0"
          fi
          echo "pct=$pct" >> "$GITHUB_OUTPUT"

          val=${pct%.*}
          if [ -z "$val" ]; then val=0; fi
          if   [ "$val" -ge 80 ]; then color=brightgreen
          elif [ "$val" -ge 70 ]; then color=green
          elif [ "$val" -ge 60 ]; then color=yellowgreen
          elif [ "$val" -ge 50 ]; then color=yellow
          else color=red
          fi
          echo "color=$color" >> "$GITHUB_OUTPUT"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-out
          path: coverage.out
          if-no-files-found: error

  publish-coverage:
    name: Publish coverage report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push'
    needs: tests
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: coverage-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-out
          path: .

      - name: Write Shields endpoint JSON
        run: |
          pct="${{ needs.tests.outputs.pct || '0' }}"
          color="${{ needs.tests.outputs.color || 'red' }}"
          branch="${{ github.ref_name }}"
          mkdir -p "./.pages/${branch}"
          cat <<EOF > "./.pages/${branch}/coverage-badge.json"
          {
            "schemaVersion": 1,
            "label": "Coverage",
            "message": "${pct}%",
            "color": "${color}",
            "cacheSeconds": 60
          }
          EOF
          mkdir -p ./.pages
          cp "./.pages/${branch}/coverage-badge.json" "./.pages/coverage-badge.json"

      - name: Generate HTML coverage report
        run: |
          branch="${{ github.ref_name }}"
          src="coverage.out"
          mkdir -p "./.pages/${branch}"
          go tool cover -html="$src" -o "./.pages/${branch}/index.html"
          mkdir -p ./.pages
          cp "./.pages/${branch}/index.html" "./.pages/index.html"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: ./.pages

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

  
