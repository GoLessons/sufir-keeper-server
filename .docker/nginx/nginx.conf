worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  resolver 127.0.0.11 ipv6=off;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 4096;

  server {
    listen 80;
    server_name _;

    client_max_body_size 2g;

    # API + CORS (strip /api/v1 prefix)
    location /api/v1/ {
      if ($request_method = OPTIONS) { return 204; }

      add_header Access-Control-Allow-Origin * always;
      add_header Access-Control-Allow-Credentials true always;
      add_header Access-Control-Expose-Headers Content-Disposition always;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Forwarded-Host $host;

      proxy_http_version 1.1;
      proxy_request_buffering off;

      rewrite ^/api/v1/(.*)$ /$1 break;
      proxy_pass http://app:8080;
    }

    location = /api/v1/files/presign {
      limit_except POST { deny all; }
      if ($request_method = OPTIONS) { return 204; }

      add_header Access-Control-Allow-Origin * always;
      add_header Access-Control-Allow-Credentials true always;
      add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
      rewrite ^/api/v1/(.*)$ /$1 break;
      proxy_pass http://app:8080;
    }

    location = /api/v1/files {
      limit_except POST { deny all; }
      if ($request_method = OPTIONS) { return 204; }

      add_header Access-Control-Allow-Origin * always;
      add_header Access-Control-Allow-Credentials true always;
      add_header Access-Control-Expose-Headers Content-Disposition always;
      add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-File-Id, X-Checksum, X-Filename, X-Mime" always;

      if ($http_authorization = "") { return 401; }
      proxy_http_version 1.1;
      proxy_request_buffering off;
      auth_request /api/v1/auth-verify;
      auth_request_set $user_id $upstream_http_x_user_id;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization "";
      proxy_pass http://minio:9000/keeper;
    }

    # Swagger UI
    location = /swagger {
      return 302 /swagger/;
    }
    location ^~ /swagger/ {
      proxy_set_header Host $host;
      rewrite ^/swagger/(.*)$ /$1 break;
      proxy_pass http://swagger-ui:8080;
    }

    location = / {
      return 302 /swagger/;
    }
  }
}
